name: KR-05 Binance cost-aware backtest

on:
  push:
    branches: [feat/kr05-backtesting]
    paths:
      - "research/backtest.py"
      - ".github/workflows/kr05-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout SHA-256 verified Binance candles
        run: |
          git fetch --depth 1 origin market-data
          git show origin/market-data:datasets/BTCUSDT_1h_research.csv > /tmp/BTCUSDT_1h_research.csv
          git show origin/market-data:datasets/BTCUSDT_1h_research.csv.json > /tmp/BTCUSDT_1h_research.csv.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch and Kronos dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Generate 240 strictly out-of-sample model predictions
        run: |
          python -m research.evaluate_kronos \
            --csv /tmp/BTCUSDT_1h_research.csv --symbol BTCUSDT --interval 1h \
            --lookback 128 --evaluations 240 \
            --output research/output/kr05_predictions.json
      - name: Simulate target-open/target-close spot trades with cost assumptions
        run: |
          python -m research.backtest \
            --csv /tmp/BTCUSDT_1h_research.csv \
            --forecast-json research/output/kr05_predictions.json \
            --fee-bps 10 --spread-bps 2 --slippage-bps 3 --edge-bps 20 \
            --output research/output/kr05_backtest.json
      - name: Upload forecasts and research-only simulation ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr05-binance-backtest
          path: research/output/kr05_*.json
          if-no-files-found: warn
          retention-days: 14
