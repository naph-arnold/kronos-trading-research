name: Research CI

on:
  push:
    branches: [master, develop/trading-system]
  pull_request:
    branches: [master, develop/trading-system]
  workflow_dispatch:
    inputs:
      full_model_regression:
        description: "Run slow pretrained-model regression tests (downloads model weights)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install numpy==1.26.4 pandas==2.2.2
      - name: Check Python syntax
        run: python -m compileall -q model examples tests webui research
      - name: Lint project configuration and smoke tests
        run: ruff check research/market_data.py research/datasets.py research/coinbase_data.py tests/test_project_smoke.py tests/test_market_data.py tests/test_datasets.py tests/test_coinbase_data.py research/evaluate_kronos.py tests/test_kronos_evaluation.py research/backtest.py tests/test_backtest.py research/forecast_service.py research/forecast_http.py tests/test_forecast_api.py
      - name: Run fast tests (no model downloads)
        run: python -m pytest -q tests/test_project_smoke.py tests/test_market_data.py tests/test_datasets.py tests/test_kronos_evaluation.py tests/test_backtest.py tests/test_forecast_api.py
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  model-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_model_regression }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Execute full model regression
        run: python -m pytest -q tests/test_kronos_regression.py
