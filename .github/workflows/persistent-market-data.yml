name: Persistent OHLCV data verification

# Daily schedule runs only when this workflow reaches the default branch.
# Development pushes provide an integration check before promotion.
on:
  schedule:
    - cron: '17 2 * * *'  # approximately 05:17 Africa/Nairobi; GitHub may delay jobs
  push:
    branches: [develop/trading-system, fix/binance-market-data]
    paths:
      - "research/**"
      - ".github/workflows/persistent-market-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persistent-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load durable data branch
        run: |
          git fetch origin market-data
          git worktree add --detach data-store origin/market-data
      - name: Retrieve only missing closed Binance BTCUSDT hourly candles
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from research.datasets import update_dataset
          from research.market_data import INTERVAL_MS, parse_time

          symbol = "BTCUSDT"
          interval = "1h"
          step = INTERVAL_MS[interval]
          now = datetime.now(timezone.utc)
          end_ms = (int(now.timestamp() * 1000) // step) * step
          destination = Path("data-store/datasets/BTCUSDT_1h.csv")
          # Bootstrap 7 days, then reuse the manifest's original start.
          manifest = destination.with_suffix(".csv.json")
          if manifest.exists():
              import json
              start_ms = int(json.loads(manifest.read_text())["start_ms"])
          else:
              start_ms = end_ms - 7 * 24 * step
          result = update_dataset(
              destination, symbol=symbol, interval=interval,
              start_ms=start_ms, end_ms=end_ms, now_ms=end_ms,
              source="binance_spot"
          )
          print(f"Verified Binance {result['row_count']} candles, added {result['new_rows']}; SHA256={result['sha256']}")
          PY
      - name: Save validated public data into durable branch
        run: |
          git -C data-store config user.name "github-actions[bot]"
          git -C data-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data-store add datasets/BTCUSDT_1h.csv datasets/BTCUSDT_1h.csv.json
          if git -C data-store diff --cached --quiet; then
            echo "No new complete market candles."
          else
            git -C data-store commit -m "data: refresh validated BTCUSDT 1h candles"
            git -C data-store push origin HEAD:market-data
          fi
